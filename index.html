<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coach App</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- HOME -->
<div id="home" class="page active">
  <div class="center">
    <h1>🏐 Coach App</h1>
    <button onclick="goToSport()">Commencer</button>
  </div>
</div>

<!-- SPORT -->
<div id="sport" class="page">
  <div class="center">
    <h2>Choisir un sport</h2>
    <button onclick="selectSport('handball')">Handball</button>
    <button disabled>Football</button>
  </div>
</div>

<!-- TEAMS -->
<div id="teams" class="page">

  <h2 style="text-align:center;">Création des équipes</h2>

  <div class="teams-container">

    <!-- TEAM A -->
    <div class="team" id="teamABox">

      <h3>Équipe A</h3>

      <label>Nom équipe</label>
      <input id="teamAName" placeholder="Équipe A">

      <!-- COULEUR SANS TEXTE -->
      <div class="color-box">
        <input type="color" id="teamAColor" value="#3b82f6">
      </div>

      <div class="player-form">
        <input id="inputAName" placeholder="Nom joueur">
        <input id="inputANumber" type="number" placeholder="N°">
        <button onclick="addPlayer('A')">Ajouter</button>
      </div>

      <ul id="listA"></ul>
    </div>

    <!-- TEAM B -->
    <div class="team" id="teamBBox">

      <h3>Équipe B</h3>

      <label>Nom équipe</label>
      <input id="teamBName" placeholder="Équipe B">

      <!-- COULEUR SANS TEXTE -->
      <div class="color-box">
        <input type="color" id="teamBColor" value="#ef4444">
      </div>

      <div class="player-form">
        <input id="inputBName" placeholder="Nom joueur">
        <input id="inputBNumber" type="number" placeholder="N°">
        <button onclick="addPlayer('B')">Ajouter</button>
      </div>

      <ul id="listB"></ul>
    </div>

  </div>

  <button class="validate" onclick="goToTime()">Valider équipes</button>

</div>

<!-- TIME -->
<div id="time" class="page">

  <div class="center">
    <h2>Configuration match</h2>

    <input id="periodTime" type="number" placeholder="Durée période (min)">
    <input id="periodCount" type="number" placeholder="Nombre de périodes">

    <button onclick="goToDashboard()">Lancer match</button>
  </div>

</div>

<!-- DASHBOARD -->
<div id="dashboard" class="page">

  <h2 style="text-align:center;">📊 Match</h2>
  <div id="display"></div>

</div>

<script src="app.js"></script>
</body>
</html>
