<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Coach Stats</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- PAGE ACCUEIL -->
<div id="home" class="page active">
  <div class="center">
    <h1>🏐 Coach Stats</h1>
    <button onclick="goToSport()">Commencer</button>
  </div>
</div>

<!-- PAGE SPORT -->
<div id="sport" class="page">

  <div class="center">
    <h2>Choisir un sport</h2>

    <button onclick="selectSport('handball')">Handball</button>
    <button disabled>Football (bientôt)</button>
  </div>

</div>

<!-- CONFIG HAND -->
<div id="config" class="page">

  <h2>Configuration Handball</h2>

  <div class="teams">

    <!-- TEAM A -->
    <div class="team-card">
      <h3>Équipe A</h3>

      <input id="teamAName" placeholder="Nom équipe A">

      <input type="color" id="teamAColor" value="#3b82f6">

      <input id="teamAPlayer" placeholder="Ajouter joueur">
      <button onclick="addPlayer('A')">Ajouter</button>

      <ul id="teamAList"></ul>
    </div>

    <!-- TEAM B -->
    <div class="team-card">
      <h3>Équipe B</h3>

      <input id="teamBName" placeholder="Nom équipe B">

      <input type="color" id="teamBColor" value="#ef4444">

      <input id="teamBPlayer" placeholder="Ajouter joueur">
      <button onclick="addPlayer('B')">Ajouter</button>

      <ul id="teamBList"></ul>
    </div>

  </div>

  <button class="start-btn" onclick="startDashboard()">
    Lancer le dashboard
  </button>

</div>

<!-- DASHBOARD -->
<div id="dashboard" class="page">

  <h2>📊 Match Handball</h2>

  <div id="teamsDisplay"></div>

</div>

<script src="app.js"></script>
</body>
</html>
